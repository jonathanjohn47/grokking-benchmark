# ======================================================================
# Nanda-Unified — the SINGLE common benchmark protocol.
#
# Every grokking predictor in this thesis (L2-Norm, Dropout, Spectral,
# HTSR Alpha, AGE, Weight-PCA, Higher-MI, Commutator Defect, ...) is to
# be measured on a model trained with EXACTLY these settings. No
# predictor gets its own substrate.
#
# This file is the source of truth. src/train_four_head.py loads it at
# startup and asserts its own constants against it, so the two can never
# drift silently.
#
# Why this exact configuration (see context.md, Sept 3-4 2026 sessions):
#   - It is a faithful replication of Nanda et al. (2023) "Progress
#     Measures for Grokking via Mechanistic Interpretability", whose
#     1-layer / full-batch / no-warmup modular-addition transformer is
#     the substrate the grokking-predictor literature standardised on.
#   - The old default substrate (p=97, PyTorch-default init, betas
#     0.9/0.999) carried two artefacts that pollute every weight-space
#     predictor: a token-embedding init transient crushed by weight
#     decay in the first ~2000 epochs, and a beta2=0.999 slingshot
#     spike at the grok transition. Both are gone here.
#   - The aligned setup reproduces Nanda Figure 7 (weight norm rises
#     during memorisation, declines through circuit formation, drops
#     through grokking, then flat floor) cleanly across seeds.
# ======================================================================

task:
  operation: "(a + b) mod p"
  modulus: 113                 # Nanda mainline prime. NOT 97.
  equals_token_id: 113         # number tokens are 0..p-1; "=" token id is p
  vocab_size: 114              # p + 1
  sequence: "a b ="            # 3 positions; logits read at the "=" position
  read_position: 2
  train_fraction: 0.3          # 30 / 70 random split
  split: random

architecture:
  layers: 1
  num_heads: 4
  d_model: 128
  head_dim: 32                 # d_model / num_heads
  d_mlp: 512                   # 4 * d_model
  mlp_activation: relu
  layernorm: false             # Nanda uses NO LayerNorm (paper Section 3)
  tied_embeddings: false
  positional_embedding: learned
  attention_bias: false        # no bias in query / key / value
  embedding_bias: false
  unembedding_bias: false      # no bias in output_head
  mlp_bias: true               # Nanda keeps b_in / b_out in the MLP

init:
  scheme: transformerlens_small
  init_std_formula: "0.8 / sqrt(d_model)"
  init_std: null               # null -> computed from the formula (~0.0707 for d_model=128)
  applies_to:                  # every weight matrix, embeddings included
    - token_embedding
    - position_embedding
    - query
    - key
    - value
    - mlp_in
    - mlp_out
    - output_head
  bias_init: zeros             # MLP biases start at 0 (TransformerLens convention)

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 1.0            # decoupled (torch.optim.AdamW)
  betas: [0.9, 0.98]           # NOT the PyTorch default (0.9, 0.999)

training:
  epochs: 40000
  full_batch: true             # batch_size = floor(train_fraction * p * p)
  warmup_steps: 0
  loss: cross_entropy
  device_preference: [mps, cpu]

seeds:
  per_predictor_min_runs: 3    # fresh torch.seed() per run, recorded to seed.npy
  limit_cycle_diagnostic_runs: 5   # p=113 post-grok oscillation check (see context.md)

logging:
  # Weight-norm quantities recorded every epoch for the weight-space predictors.
  weight_norm_total_l2: true            # sqrt(sum w^2) over all parameters
  weight_norm_total_sum_w2: true        # sum w^2 over all parameters (Nanda Fig 7 quantity)
  weight_norm_per_module_sum_w2: true   # groups: token_embedding, position_embedding,
                                        #         attention_qkv, mlp, output_head
